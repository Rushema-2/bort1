<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Here</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="./sign-up.css">
</head>

<body>

    <div class="register-container">

    
        <div class="register-left">

            <h1>Register Here</h1>

            <div class="icon">
                <img src="../image/sign.png">
            
            </div>

        </div>


     
        <div class="register-right">

            <form>
                 <label for="">
                <input
                    type="text"
                    id="first-name"
                    placeholder="Enter first name"
                    required
                >
                <span id="firstNme-validation"></span>
                </label>

                <label for="">

                <input
                    type="text"
                    id="last-name"
                    placeholder="Enter last name"
                    required
                >
                 <span id="lastName-validation"></span>
                 </label>

                 <label for="">

                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
                 <span id="email-validation"></span>
                    </label>


                    <label for="">
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone"
                    required
                >
                <span id="phone-validation"></span>
                </label>


                <label for="">

                <input type="password" id="password" placeholder="Enter yuor password">
                 <span id="password"></span>
                </label>

                <button type="submit">Sign up</button>

            </form>

        </div>

    </div>

    <script src="./sign-up.js"></script>

</body>
</html>
